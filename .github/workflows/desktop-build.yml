name: Desktop CI/CD

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semantic Version bump for release'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  version:
    name: Resolve package version
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      package_version: ${{ steps.resolve.outputs.package_version }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      is_release: ${{ steps.resolve.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: resolve
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Release tags must use the vMAJOR.MINOR.PATCH format." >&2
              exit 1
            fi

            VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            TAG="$GITHUB_REF_NAME"
            echo "package_version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"

          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            BUMP="${{ inputs.bump }}"
            LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" | sort -V | tail -n 1)

            if [[ -z "$LATEST_TAG" ]]; then
              MAJOR=1
              MINOR=0
              PATCH=0
            else
              if [[ "$LATEST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                MAJOR="${BASH_REMATCH[1]}"
                MINOR="${BASH_REMATCH[2]}"
                PATCH="${BASH_REMATCH[3]}"
              else
                MAJOR=1
                MINOR=0
                PATCH=0
              fi

              case "$BUMP" in
                major)
                  MAJOR=$((MAJOR + 1))
                  MINOR=0
                  PATCH=0
                  ;;
                minor)
                  MINOR=$((MINOR + 1))
                  PATCH=0
                  ;;
                patch)
                  PATCH=$((PATCH + 1))
                  ;;
              esac
            fi

            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            NEW_TAG="v${NEW_VERSION}"

            echo "Bumping from ${LATEST_TAG:-none} to ${NEW_TAG} (${BUMP})"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$NEW_TAG"
            git push origin "$NEW_TAG"

            echo "package_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "release_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"

          else
            echo "package_version=1.0.0" >> "$GITHUB_OUTPUT"
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Run JVM Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run Tests
        run: ./gradlew --stacktrace :shared:jvmTest

  linux:
    name: Build Linux installers (DEB & RPM)
    needs:
      - version
      - test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm binutils

      - name: Package DEB and RPM
        run: ./gradlew --stacktrace "-PpackageVersion=${{ needs.version.outputs.package_version }}" :desktopApp:packageDeb :desktopApp:packageRpm

      - name: Upload Linux DEB installer
        uses: actions/upload-artifact@v4
        with:
          name: inventairemed-linux-deb
          path: desktopApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux RPM installer
        uses: actions/upload-artifact@v4
        with:
          name: inventairemed-linux-rpm
          path: desktopApp/build/compose/binaries/main/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build Windows installers (MSI & EXE)
    needs:
      - version
      - test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Add WiX to PATH
        shell: pwsh
        run: |
          $wixBin = Get-ChildItem -Path "C:\Program Files (x86)" -Directory -Filter "WiX Toolset v*" |
            Sort-Object Name -Descending |
            Select-Object -First 1 |
            ForEach-Object { Join-Path $_.FullName "bin" }

          if (-not $wixBin -or -not (Test-Path (Join-Path $wixBin "candle.exe"))) {
            throw "WiX Toolset was not found on the runner."
          }

          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Package MSI and EXE
        shell: pwsh
        run: .\gradlew.bat --stacktrace "-PpackageVersion=${{ needs.version.outputs.package_version }}" :desktopApp:packageMsi :desktopApp:packageExe

      - name: Upload Windows MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: inventairemed-windows-msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: inventairemed-windows-exe
          path: desktopApp/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: needs.version.outputs.is_release == 'true'
    needs:
      - version
      - linux
      - windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Linux DEB installer
        uses: actions/download-artifact@v4
        with:
          name: inventairemed-linux-deb
          path: release-assets/linux/deb

      - name: Download Linux RPM installer
        uses: actions/download-artifact@v4
        with:
          name: inventairemed-linux-rpm
          path: release-assets/linux/rpm

      - name: Download Windows MSI installer
        uses: actions/download-artifact@v4
        with:
          name: inventairemed-windows-msi
          path: release-assets/windows/msi

      - name: Download Windows EXE installer
        uses: actions/download-artifact@v4
        with:
          name: inventairemed-windows-exe
          path: release-assets/windows/exe

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.release_tag }}
        shell: bash
        run: |
          files=(
            release-assets/linux/deb/*.deb
            release-assets/linux/rpm/*.rpm
            release-assets/windows/msi/*.msi
            release-assets/windows/exe/*.exe
          )

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --title "$TAG" --generate-notes
          fi
