name: Desktop CI/CD

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version:
    name: Resolve package version
    runs-on: ubuntu-24.04
    outputs:
      package_version: ${{ steps.resolve.outputs.package_version }}
    steps:
      - id: resolve
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Release tags must use the vMAJOR.MINOR.PATCH format." >&2
              exit 1
            fi

            echo "package_version=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"
          else
            echo "package_version=1.0.0" >> "$GITHUB_OUTPUT"
          fi

  linux:
    name: Build Linux installer
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and package DEB
        run: ./gradlew --stacktrace "-PpackageVersion=${{ needs.version.outputs.package_version }}" :shared:jvmTest :desktopApp:packageDeb

      - name: Upload Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: inventairemed-linux-deb
          path: desktopApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build Windows installer
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Add WiX to PATH
        shell: pwsh
        run: |
          $wixBin = Get-ChildItem -Path "C:\Program Files (x86)" -Directory -Filter "WiX Toolset v*" |
            Sort-Object Name -Descending |
            Select-Object -First 1 |
            ForEach-Object { Join-Path $_.FullName "bin" }

          if (-not $wixBin -or -not (Test-Path (Join-Path $wixBin "candle.exe"))) {
            throw "WiX Toolset was not found on the runner."
          }

          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Package MSI
        shell: pwsh
        run: .\gradlew.bat --stacktrace "-PpackageVersion=${{ needs.version.outputs.package_version }}" :desktopApp:packageMsi

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: inventairemed-windows-msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs:
      - linux
      - windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: inventairemed-linux-deb
          path: release-assets/linux

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: inventairemed-windows-msi
          path: release-assets/windows

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          files=(release-assets/linux/*.deb release-assets/windows/*.msi)

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --title "$TAG" --generate-notes
          fi
